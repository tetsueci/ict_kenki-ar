<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>重機 AR（試作）</title>

<!-- iPhone で WebXR を使うための Variant Launch。
     ★共通部品の正は ict_ar-viewer/common/vlaunch.js なので、写さずにそこから読む。
     ★module より**先に**、普通の script として読むこと（document.write で
       SDK を差し込むため）。読むのは iPhone/iPad のときだけで、
       Android・PC では何も起きない -->
<script src="https://tetsueci.github.io/ict_ar-viewer/common/vlaunch.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* ★クラスや id で display を指定すると [hidden] が負ける。
     読み込み中の幕と縮尺の列で実際に踏んだので、最初にかぜを止める */
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.6 system-ui, sans-serif; background: #111; color: #eee; }
  canvas { display: block; }
  /* ★★#ui は dom-overlay の親。AR 中は UA がこれを**全画面**にする。
     だから背景もぼかしもここに付けてはいけない。
     backdrop-filter: blur(6px) を付けていたせいで、
     **カメラ映像もモデルも画面ごとぼけていた**（2026-10-06 実機で発生）。
     align.js の #overlay も透明で pointer-events: none。同じにする。
     透かすことで、操作盤の外をタップすれば地面に置ける */
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px 14px;
           background: rgba(20,20,22,.92); pointer-events: auto; }
  .row { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
  .row label { flex: 0 0 7.5em; font-size: 13px; color: #bbb; }
  .row input[type=range] { flex: 1 1 auto; min-width: 0; }
  .row .val { flex: 0 0 5em; text-align: right; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #555;
           background: #2a2a2e; color: #eee; }
  button.on { background: #1f6feb; border-color: #1f6feb; }
  select { font: inherit; padding: 6px 10px; border-radius: 8px;
           border: 1px solid #555; background: #2a2a2e; color: #eee; }
  .muted { font-size: 12px; color: #8b9199; }
  #read { font-size: 17px; font-weight: 600; margin: 2px 0 6px; }
  /* ★知らせは必ず全部読めるようにする。横に並べると切れて、
     肝心の理由が見えない（2026-10-06 に実際そうなった）*/
  #msg { font-size: 13px; color: #d0d4d8; line-height: 1.45;
         white-space: pre-wrap; word-break: break-word; margin-top: 4px; }
  #msg:empty { display: none; }
  #msg.err { color: #ffb4a8; }
  #load { position: fixed; inset: 0; display: grid; place-items: center;
          background: #111; font-size: 15px; color: #999; }
</style>

<div id="load">読み込み中…</div>
<div id="ui" hidden>
  <div id="panel">
    <div id="read"></div>
    <div class="row" id="machines"></div>
    <div id="sliders"></div>
    <div class="row" id="scales" hidden><label>縮尺</label></div>
    <div class="row" id="dists" hidden><label>置く距離</label></div>
    <div class="row"><button id="ar">AR で置く</button></div>
    <div id="msg"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/+esm';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js/+esm';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js/+esm';
import { poseCrawlerCrane } from './src/ccrane.js';
import { poseRoughTerrainCrane } from './src/rcrane.js';

const KINEMATICS = {
  rough_terrain_crane: poseRoughTerrainCrane,
  crawler_crane: poseCrawlerCrane,
};
const LIST = ['KATO_SR250Rf2', '120tcrawlercrane'];
// ドロップダウンに出す短い名前。★正は machines/*.json の short
const SHORT = {};
await Promise.all(LIST.map(async id => {
  try {
    const j = await (await fetch(`machines/${id}.json`, { cache: 'no-cache' })).json();
    SHORT[id] = j.short || j.title || id;
  } catch { SHORT[id] = id; }
}));

// ---- 画面 -----------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
// ★これが無いと Android の一部で AR が始まらない。
//   three.js の既定は 'local-floor' だが、対応していない端末があり、
//   setSession の中で
//     Failed to execute 'requestReferenceSpace' on 'XRSession':
//     This device does not support the requested reference space type
//   で落ちる（2026-10-06 に実機で発生）。
//   ict_ar-viewer/common/align.js も 'local' にしている
renderer.xr.setReferenceSpaceType('local');
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(4, 9, 3); scene.add(sun);
// ★画角と前後の切りとろは align.js と同じにする。
//   AR では画角は端末が決めるが、近い側の切りとろ（0.01m）は効く。
//   1/50 に縮めると手元まで寄れるので、ここが浅いと前が欠ける
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 300);
// 3D で見るときだけ回せるようにする（AR のときは WebXR がカメラを持つ）
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// CAD（Z 上・mm）→ three.js（Y 上・m）。ict_ar-viewer の align.js と同じ向きの取り方。
// ★部品の GLB も姿勢の行列もぜんぶ CAD のまま（mm・Z 上）。変換はここ 1 か所だけ
const world = new THREE.Group();
world.matrixAutoUpdate = false;
scene.add(world);
const grid = new THREE.GridHelper(120, 60, 0x555555, 0x2c2c2c);
scene.add(grid);

let arScale = 1;                      // AR のときだけ縮める
let arDiv = 10;                       // AR の縮尺の分母（1/10）
// ★縮尺と距離は組で決める。既定は 1/10 × 10m：
//   25t ラフターが 1.8m ほどになり、10m 先なら全体の動きが見える。
//   狭いところなら 1/50 × 足元、外なら 実寸 × 20m
// ★実寸（1/1）は外でしか意味がないし、小さすぎても読めない。
//   ict_ar-viewer が行き着いた候補にそろえる
const AR_DIVS = [1, 10, 25, 50, 100];
const scaleRow = document.getElementById('scales');
// ★地面の検出は足元にしか出ないことが多い。
//   そこに置くと、離れないと動きが見えない。
//   見ている方向へ指定した距離だけ出して、見つかった床の高さに落とす
let arDist = 10;
const AR_DISTS = [0, 5, 10, 20, 50];
const distRow = document.getElementById('dists');
for (const k of AR_DISTS) {
  const b = document.createElement('button');
  b.textContent = k === 0 ? '足元' : k + 'm';
  if (k === arDist) b.className = 'on';
  b.onclick = () => {
    arDist = k;
    [...distRow.querySelectorAll('button')].forEach(
      (x, i) => x.classList.toggle('on', AR_DISTS[i] === k));
  };
  distRow.appendChild(b);
}
for (const k of AR_DIVS) {
  const b = document.createElement('button');
  b.textContent = k === 1 ? '実寸' : '1/' + k;
  if (k === arDiv) b.className = 'on';
  b.onclick = () => {
    arDiv = k; arScale = 1 / k;
    [...scaleRow.querySelectorAll('button')].forEach(
      (x, i) => x.classList.toggle('on', AR_DIVS[i] === k));
  };
  scaleRow.appendChild(b);
}
function placeWorld() {
  const k = 0.001 * arScale;
  world.matrix.set(k, 0, 0, 0,
                   0, 0, k, 0,
                   0, -k, 0, 0,
                   0, 0, 0, 1);
  world.matrix.setPosition(world.position);
}

// ---- 機械を読む -----------------------------------------------------
const loader = new GLTFLoader();
const CYAN = new THREE.MeshStandardMaterial({ color: 0x18c6c6, roughness: .7, metalness: .15 });
const GREY = new THREE.MeshStandardMaterial({ color: 0x9aa3ad, roughness: .8, metalness: .1 });
const DARK = new THREE.MeshStandardMaterial({ color: 0x4e545c, roughness: .85, metalness: .1 });
const matOf = n => (/^(body|outrigger|plate|foot)/.test(n) ? DARK
  : /^(cabin|boom\d|jib)/.test(n) ? CYAN : GREY);

// 4 本のアウトリガは同じブロックを使い回す
const COPIES = { 'outrigger': 'outrigger', 'outrigger-foot': 'foot', 'outrigger-base': 'plate' };

let M = null, nodes = {}, st = {}, pose = null;

async function loadMachine(id) {
  const ld = document.getElementById('load');
  ld.hidden = false; ld.textContent = '読み込み中…';
  world.clear(); nodes = {};
  M = await (await fetch(`machines/${id}.json`, { cache: 'no-cache' })).json();
  pose = KINEMATICS[M.type];

  if (M.models) {
    const parts = await (await fetch(M.models + '_parts.json', { cache: 'no-cache' })).json();
    for (const [name, info] of Object.entries(parts)) {
      const g = await loader.loadAsync(M.models + info.file);
      g.scene.traverse(c => { if (c.isMesh) c.material = matOf(name); });
      const put = (key, obj) => {
        const o = new THREE.Group();
        o.add(obj); o.matrixAutoUpdate = false; o.visible = false;
        world.add(o); nodes[key] = o;
      };
      if (name in COPIES) {
        for (const s of ['fr', 'fl', 'br', 'bl']) put(COPIES[name] + '_' + s, g.scene.clone(true));
      } else {
        put(name, g.scene);
      }
    }
  }

  st = {};
  if (M.type === 'rough_terrain_crane') {
    st = { outrigger: M.limits.outrigger_min, angleCabin: 0, angleBoom: 45,
           lengthBoom: M.limits.length_boom_min, lengthWire: 10 };
  } else {
    st = { boomType: 0, angleCabin: 0, angleBoom: 60, lengthWire: 10 };
  }
  buildUI(); apply(); frameCamera();
  ld.hidden = true;
  document.getElementById('ui').hidden = false;
  meshMsg = M.models ? ''
    : 'この機械は部品のメッシュがまだありません（計算だけ動いています）';
  showMsg();
}

function buildUI() {
  // ★機種はドロップダウン。ボタンを並べると長い名前で 1 行を食いつぶす。
  //   出す名前は machines/*.json の short（25tRC・120tCC）
  const mw = document.getElementById('machines');
  mw.innerHTML = '<label>機械</label>';
  const sel = document.createElement('select');
  for (const id of LIST) {
    const o = document.createElement('option');
    o.value = id;
    o.textContent = SHORT[id] || id;
    if (id === M.id) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = () => loadMachine(sel.value);
  mw.appendChild(sel);
  const t = document.createElement('span');
  t.className = 'muted';
  t.textContent = M.title;
  mw.appendChild(t);
  const sw = document.getElementById('sliders');
  sw.innerHTML = '';
  for (const c of M.controls) {
    const row = document.createElement('div'); row.className = 'row';
    if (c.type === 'choice') {
      row.innerHTML = `<label>${c.label}</label>`;
      M[c.from].forEach((o, i) => {
        const b = document.createElement('button');
        b.textContent = o.name;
        if (st[c.key] === i) b.className = 'on';
        b.onclick = () => { st[c.key] = i; buildUI(); apply(); };
        row.appendChild(b);
      });
    } else {
      row.innerHTML = `<label>${c.label}</label>
        <input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${st[c.key]}">
        <span class="val"></span>`;
      const inp = row.querySelector('input'), val = row.querySelector('.val');
      const show = () => { val.textContent = (+inp.value).toFixed(c.step < 1 ? 1 : 0) + c.unit; };
      inp.oninput = () => { st[c.key] = +inp.value; show(); apply(); };
      show();
    }
    sw.appendChild(row);
  }
}

function apply() {
  const r = pose(M, st, { point: [0, 0, 0], angle: 0, normal: [0, 0, 1] });
  for (const [name, o] of Object.entries(nodes)) {
    const mx = r.parts[name];
    o.visible = !!mx && !(r.hidden && r.hidden.includes(name));
    if (mx) o.matrix.fromArray(mx);
  }
  const out = (M.readouts || []).map(x =>
    `${x.label} ${(r[x.key] * x.scale).toFixed(x.digits)}${x.unit}`);
  out.push(`先端高さ ${(r.tip[2] / 1000).toFixed(2)}m`);
  document.getElementById('read').textContent = out.join('　／　');
}

function frameCamera() {
  placeWorld(); world.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(world);
  if (!isFinite(box.min.x)) return;
  const s = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  const d = Math.max(s.x, s.y, s.z) * 0.8 + 5;
  camera.position.set(c.x + d * .72, Math.max(c.y, 3) + d * .38, c.z + d * .72);
  orbit.target.set(c.x, Math.max(c.y, 2) * .6, c.z);
  orbit.update();
}

// ---- AR -------------------------------------------------------------
const msg = document.getElementById('msg');
// ★AR の知らせと「メッシュが無い」の知らせは別々に持って合わせる。
//   1 つの欄に直接入れると、機械を読むたびに AR の知らせが消える
let arMsg = '', meshMsg = '';
const showMsg = () => {
  msg.textContent = [arMsg, meshMsg].filter(Boolean).join('\n');
  msg.classList.toggle('err', /始められません|要ります|できません/.test(arMsg));
};
const arBtn = document.getElementById('ar');
let reticle = null, hitSource = null, placed = false;

const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// ★何が起きているかを必ず画面に出す。
//   requestSession が失敗しても握りつぶしていたので、
//   「押しても何も起きない」になっていた（2026-10-06 指摘）
const diag = () => [
  location.protocol.replace(':', ''),
  'xr=' + (navigator.xr ? 'あり' : 'なし'),
  IS_IOS ? 'iOS' : (/Android/.test(navigator.userAgent) ? 'Android' : 'PC'),
].join(' ');

const arStart = () => startAR().catch(e => {
  arMsg = 'AR を始められませんでした（' + diag() + '）\n'
        + (e && e.message ? e.message : e);
  showMsg();
});

// ★頼むものを段々と減らして試す。
//   どれで落ちたかを全部書き出すので、1 往復で原因が分かる。
//   端末によっては dom-overlay や hit-test を断られることがあり、
//   その 1 つのために AR ごと始められないのはもったいない
async function requestSessionStepDown(overlay) {
  const tries = [
    ['操作盤つき', { requiredFeatures: ['hit-test'],
                     optionalFeatures: ['local', 'dom-overlay'],
                     domOverlay: { root: overlay } }],
    ['操作盤なし', { requiredFeatures: ['hit-test'] }],
    ['地面検出なし', {}],
  ];
  const ng = [];
  for (const [label, opts] of tries) {
    try {
      const session = await navigator.xr.requestSession('immersive-ar', opts);
      return { session, label, overlayOK: label === '操作盤つき', hitOK: label !== '地面検出なし', ng };
    } catch (e) {
      ng.push('・' + label + '：' + (e && e.name ? e.name + ' ' : '') + (e && e.message ? e.message : e));
    }
  }
  throw new Error(ng.join('\n'));
}

// iPhone：Variant Launch の中で開き直すと WebXR が使える（align.js と同じ）
function launchReady(d) {
  if (!d || !d.launchRequired) return false;
  arBtn.disabled = false;
  arBtn.textContent = 'AR を始める（iPhone：「開く」を押してください）';
  arBtn.onclick = () => { location.href = d.launchUrl; };
  arMsg = ''; showMsg();
  return true;
}

if (navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false)) {
  arBtn.onclick = arStart;
} else if (!launchReady(window.__vl)) {
  arBtn.disabled = true;
  arMsg = location.protocol !== 'https:'
    ? 'AR には HTTPS が要ります。いまは 3D 表示だけです（' + diag() + '）'
    : IS_IOS
      ? '準備中です。少し待ってから読み込み直してください（' + diag() + '）'
      : 'この端末・ブラウザでは AR を始められません。Android は Chrome と'
        + '「Google Play 開発者サービス（AR）」が要ります（' + diag() + '）';
  showMsg();
  // Variant Launch は遅れて用意ができる
  addEventListener('vlaunch-initialized', e => { launchReady(e.detail); });
}

async function startAR() {
  const overlay = document.getElementById('ui');
  const { session, label, overlayOK, hitOK, ng } = await requestSessionStepDown(overlay);
  if (overlayOK) {
    // ★操作盤を触ったぶんまで「地面をタップした」ことにされないようにする
    overlay.addEventListener('beforexrselect', e => e.preventDefault());
  }
  // ★ここから先で落ちたら、開いたセッションを閉じてから知らせる。
  //   閉じないと、カメラだけ映って何も操作できない状態で取り残される
  //   （requestReferenceSpace の失敗で実際そうなった）
  try {
    await startInSession(session, { label, overlayOK, hitOK, ng });
  } catch (e) {
    await session.end().catch(() => {});
    throw e;
  }
}

async function startInSession(session, { label, overlayOK, hitOK, ng }) {
  await renderer.xr.setSession(session);
  grid.visible = false; placed = false; arScale = 1 / arDiv;
  arBtn.textContent = 'AR をやめる';
  arBtn.onclick = () => session.end();
  scaleRow.hidden = false; distRow.hidden = false;
  // ★十字。align.js と同じ形（丸＋縦横の線＋真ん中の赤い点）。
  //   丸だけだと「どこが中心か」が分からないし、
  //   案内の文（十字が出たら）とも食い違う
  reticle = new THREE.Group();
  {
    const w = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });
    const r = new THREE.MeshBasicMaterial({ color: 0xff3b30, depthTest: false });
    [
      new THREE.Mesh(new THREE.RingGeometry(0.09, 0.11, 40).rotateX(-Math.PI / 2), w),
      new THREE.Mesh(new THREE.PlaneGeometry(0.30, 0.012).rotateX(-Math.PI / 2), w),
      new THREE.Mesh(new THREE.PlaneGeometry(0.012, 0.30).rotateX(-Math.PI / 2), w),
      new THREE.Mesh(new THREE.CircleGeometry(0.012, 16).rotateX(-Math.PI / 2), r),
    ].forEach(o => { o.renderOrder = 10; reticle.add(o); });
  }
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

  if (hitOK) {
    const viewer = await session.requestReferenceSpace('viewer');
    hitSource = await session.requestHitTestSource({ space: viewer });
    arMsg = '地面を映して、十字が出たらタップ（もう一度タップで置き直し）';
  } else {
    // 地面が取れないときは、目の前に置くだけにする
    world.position.set(0, -1.2, -4);
    placed = true;
    arMsg = 'この端末では地面を見つけられないので、目の前に置きました';
  }
  if (ng.length) arMsg += '\n（' + label + 'で始めました。断られたもの）\n' + ng.join('\n');
  showMsg();

  // ★置いたあとも十字は出したまま。タップのたびに置き直せる。
  //   「置いたら終わり」だと、遠くへ置き直すのに AR を出入りすることになる
  session.addEventListener('select', () => {
    if (reticle.visible) {
      world.position.setFromMatrixPosition(reticle.matrix);
      placed = true;
    }
  });
  session.addEventListener('end', () => {
    hitSource = null; grid.visible = true; arScale = 1;
    world.position.set(0, 0, 0);
    if (reticle) { scene.remove(reticle); reticle = null; }
    arBtn.textContent = 'AR で置く'; arBtn.onclick = arStart;
    scaleRow.hidden = true; distRow.hidden = true; arMsg = ''; showMsg();
    frameCamera();
  });
}

const _hitM = new THREE.Matrix4();
const _p = new THREE.Vector3();
const _o = new THREE.Vector3();
const _d = new THREE.Vector3();

renderer.setAnimationLoop((t, frame) => {
  if (frame && hitSource && reticle) {
    const ref = renderer.xr.getReferenceSpace();
    const hits = frame.getHitTestResults(hitSource);
    if (hits.length) {
      reticle.visible = true;
      _hitM.fromArray(hits[0].getPose(ref).transform.matrix);
      _p.setFromMatrixPosition(_hitM);
      if (arDist > 0) {
        // ★見ている向きへ arDist だけ出し、見つかった床の高さに落とす。
        //   地面の検出は足元までしか出ないことが多いので、
        //   「十字の場所に置く」だけだと遠くへ置けない
        const xc = renderer.xr.getCamera();
        xc.getWorldPosition(_o);
        xc.getWorldDirection(_d);
        _d.y = 0;
        if (_d.lengthSq() > 1e-6) {
          _d.normalize();
          _p.set(_o.x + _d.x * arDist, _p.y, _o.z + _d.z * arDist);
        }
      }
      // 傾きは持たせない（床の上に平らに置く）
      reticle.matrix.makeTranslation(_p.x, _p.y, _p.z);
    }
  } else if (reticle) reticle.visible = false;
  placeWorld();
  if (!renderer.xr.isPresenting) orbit.update();
  renderer.render(scene, camera);
});

await loadMachine(new URLSearchParams(location.search).get('m') || LIST[0]);
</script>
